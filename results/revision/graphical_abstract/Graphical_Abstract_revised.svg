<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="68mm" viewBox="0 0 2000 800">
  <defs>
    <marker id="arrowFinal" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#17324d"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 60px; font-weight: 700; fill: #17324d; }
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 50px; font-weight: 700; fill: #17324d; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 50px; font-weight: 400; fill: #263746; }
      .bodybold { font-family: Arial, Helvetica, sans-serif; font-size: 50px; font-weight: 700; fill: #263746; }
      .cardlabel { font-family: Arial, Helvetica, sans-serif; font-size: 44px; font-weight: 700; fill: #263746; }
      .white { font-family: Arial, Helvetica, sans-serif; font-size: 50px; font-weight: 700; fill: #ffffff; }
      .result { font-family: Arial, Helvetica, sans-serif; font-size: 42px; font-weight: 700; fill: #ffffff; }
      .chip { font-family: Arial, Helvetica, sans-serif; font-size: 50px; font-weight: 700; fill: #ffffff; }
      .metric { font-family: Arial, Helvetica, sans-serif; font-size: 52px; font-weight: 700; }
    </style>
  </defs>

  <rect width="2000" height="800" fill="#ffffff"/>
  <text x="70" y="80" class="title">Matched-sample benchmark of copy number signature compendia</text>

  <rect x="55" y="135" width="420" height="560" rx="28" fill="#f4f7fa" stroke="#cbd7e2" stroke-width="4"/>
  <text x="90" y="205" class="heading">3 compendia</text>
  <text x="90" y="265" class="body">58 signatures</text>
  <text x="90" y="325" class="body">33 cancer types</text>

  <rect x="90" y="365" width="350" height="82" rx="20" fill="#f28e2b"/>
  <text x="120" y="423" class="chip">Drews</text>
  <text x="405" y="423" text-anchor="end" class="chip">17</text>

  <rect x="90" y="470" width="350" height="82" rx="20" fill="#59a14f"/>
  <text x="120" y="528" class="chip">Steele</text>
  <text x="405" y="528" text-anchor="end" class="chip">21</text>

  <rect x="90" y="575" width="350" height="82" rx="20" fill="#4e79a7"/>
  <text x="120" y="633" class="chip">Tao</text>
  <text x="405" y="633" text-anchor="end" class="chip">20</text>

  <line x1="490" y1="415" x2="565" y2="415" stroke="#17324d" stroke-width="8" marker-end="url(#arrowFinal)"/>

  <rect x="590" y="135" width="745" height="560" rx="28" fill="#f8fbfd" stroke="#9fb7c8" stroke-width="4"/>
  <text x="630" y="205" class="heading">One benchmark</text>

  <rect x="635" y="250" width="310" height="165" rx="22" fill="#eaf2f8" stroke="#6e9ec0" stroke-width="3"/>
  <g transform="translate(710 275)">
    <rect x="0" y="0" width="34" height="34" fill="#4e79a7"/>
    <rect x="44" y="0" width="34" height="34" fill="#c9dceb"/>
    <rect x="88" y="0" width="34" height="34" fill="#8cb4d0"/>
    <rect x="0" y="44" width="34" height="34" fill="#d9e7f1"/>
    <rect x="44" y="44" width="34" height="34" fill="#4e79a7"/>
    <rect x="88" y="44" width="34" height="34" fill="#b3ccdf"/>
  </g>
  <text x="790" y="390" text-anchor="middle" class="cardlabel">Concordance</text>

  <rect x="980" y="250" width="310" height="165" rx="22" fill="#edf6ed" stroke="#74ad72" stroke-width="3"/>
  <circle cx="1080" cy="305" r="27" fill="#f28e2b"/>
  <circle cx="1140" cy="295" r="27" fill="#59a14f"/>
  <circle cx="1185" cy="335" r="27" fill="#4e79a7"/>
  <text x="1135" y="390" text-anchor="middle" class="cardlabel">Partitions</text>

  <rect x="635" y="460" width="310" height="165" rx="22" fill="#fff4e8" stroke="#e2a35d" stroke-width="3"/>
  <polyline points="690,555 735,515 780,535 825,490 885,515" fill="none" stroke="#f28e2b" stroke-width="10"/>
  <line x1="690" y1="560" x2="885" y2="560" stroke="#778590" stroke-width="5"/>
  <text x="790" y="605" text-anchor="middle" class="cardlabel">Outcomes</text>

  <rect x="980" y="460" width="310" height="165" rx="22" fill="#f2eef8" stroke="#9a82ba" stroke-width="3"/>
  <circle cx="1045" cy="515" r="24" fill="#4e79a7"/>
  <circle cx="1105" cy="515" r="24" fill="#76b7b2"/>
  <circle cx="1165" cy="515" r="24" fill="#e15759"/>
  <circle cx="1225" cy="515" r="24" fill="#b07aa1"/>
  <text x="1135" y="605" text-anchor="middle" class="cardlabel">Prediction</text>

  <line x1="1350" y1="415" x2="1425" y2="415" stroke="#17324d" stroke-width="8" marker-end="url(#arrowFinal)"/>

  <rect x="1450" y="135" width="495" height="560" rx="28" fill="#17324d"/>
  <text x="1490" y="195" class="white">Complementary,</text>
  <text x="1490" y="255" class="white">not</text>
  <text x="1490" y="315" class="white">interchangeable</text>
  <line x1="1490" y1="345" x2="1905" y2="345" stroke="#7893a8" stroke-width="3"/>

  <text x="1470" y="410" class="result">Selective concordance</text>
  <text x="1470" y="470" class="result">Distinct groupings</text>
  <text x="1470" y="530" class="result">F1 (distinct targets)</text>

  <text x="1490" y="600" class="metric" fill="#f28e2b">0.93</text>
  <text x="1640" y="600" class="metric" fill="#59a14f">0.64</text>
  <text x="1790" y="600" class="metric" fill="#7eb1d6">0.64</text>
  <text x="1490" y="655" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="#f7c997">Drews</text>
  <text x="1640" y="655" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="#b8d9b5">Steele</text>
  <text x="1790" y="655" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="#b7d4e8">Tao</text>

  <rect x="55" y="725" width="1890" height="58" rx="24" fill="#e9eff4"/>
  <text x="1000" y="770" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#17324d">Expression-only models retained F1 for Drews and Steele, not Tao</text>
</svg>
